# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering dates within the migration file
timezone = UTC

# Max length of identifiers
truncate_slug_length = 40

# Set to 'true' to run the environment during 'revision' command
revision_environment = false

# set to 'true' to allow .pyc and .pyo files under 'script_location'
sourceless = false

# version location specification; This defaults to alembic/versions
version_locations = %(here)s/%(script_location)s/versions

# Output encoding
output_encoding = utf-8

[post_write_hooks]
# hooks can be specified here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S