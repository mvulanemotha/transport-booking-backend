version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: transport_postgres_dev
    environment:
      POSTGRES_USER: "${DB_USER:?error: DB_USER is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?error: DB_PASSWORD is required}"
      POSTGRES_DB: "${DB_NAME:?error: DB_NAME is required}"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: transport_redis_dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: transport_backend_dev
    environment:
      DATABASE_URL: "${DATABASE_URL:?error: DATABASE_URL is required}"
      REDIS_URL: "${REDIS_URL:?error: REDIS_URL is required}"
      SECRET_KEY: "${SECRET_KEY:?error: SECRET_KEY is required}"
      ALGORITHM: "${ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:?error: BACKEND_CORS_ORIGINS is required}"
      DEBUG: "${DEBUG:-True}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data: