version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: transport_postgres_dev
    environment:
      POSTGRES_USER: mkhululi
      POSTGRES_PASSWORD: mkhululi24680
      POSTGRES_DB: transport
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkhululi -d transport"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: transport_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: transport_backend_dev
    environment:
      DATABASE_URL: postgresql+asyncpg://mkhululi:mkhululi24680@${DB_HOST}:5432/transport
      REDIS_URL: redis://169.58.108.247:6379/0
      SECRET_KEY: dev-secret-key-12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://169.58.108.247
      DEBUG: "True"
      LOG_LEVEL: "DEBUG"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data: